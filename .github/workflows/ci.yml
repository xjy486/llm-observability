name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk-tests:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: pip install -e sdk/python
      - run: |
          python -m pytest sdk/tests/ -q --tb=short

  core-tests:
    name: Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: |
          python -m pytest tests/ -q --tb=short

  proxy-tests:
    name: Proxy Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: |
          python -c "import sys; sys.path.insert(0,'proxy'); sys.path.insert(0,'core'); import trace_context, handler; print('proxy OK')"

  ui-typecheck:
    name: UI TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: ui
        run: |
          npm ci
          npx tsc --noEmit

  phase2-regression:
    name: Phase 2.1-2.5 Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: pip install -e sdk/python
      - run: |
          python -m pytest tests/test_phase2_2_final_fixes.py sdk/tests/test_phase2_3_regression.py sdk/tests/test_phase2_5_fixes.py -q --tb=short

  # ── Phase 3 Gateway Observability (task 9.1) ──
  gateway-runtime-tests:
    name: Gateway Runtime Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: pip install -e sdk/python
      - run: |
          python -m pytest sdk/tests/gateway_observability/test_router_span.py \
            sdk/tests/gateway_observability/test_attempt_span.py \
            sdk/tests/gateway_observability/test_retry.py \
            sdk/tests/gateway_observability/test_fallback.py \
            sdk/tests/gateway_observability/test_cache_rate_limit.py \
            sdk/tests/gateway_observability/test_usage.py \
            sdk/tests/gateway_observability/test_cost.py \
            sdk/tests/gateway_observability/test_privacy.py \
            sdk/tests/gateway_observability/test_sampling.py \
            sdk/tests/gateway_observability/test_fail_open.py \
            sdk/tests/gateway_observability/test_registry_cleanup.py \
            -q --tb=short

  oneapi-adapter-tests:
    name: One-API Adapter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: pip install -e sdk/python
      - run: |
          python -m pytest sdk/tests/gateway_observability/test_oneapi_adapter.py \
            sdk/tests/gateway_observability/test_e2e_scenarios.py \
            -q --tb=short

  gateway-streaming-tests:
    name: Gateway Streaming Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: pip install -e sdk/python
      - run: |
          python -m pytest sdk/tests/gateway_observability/test_streaming.py -q --tb=short

  real-e2e:
    name: Real E2E (Live Endpoint)
    runs-on: ubuntu-latest
    # Only on trusted branches with secrets; fork PRs excluded
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: pip install -e sdk/python
      - env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_MODEL: ${{ secrets.E2E_MODEL }}
        run: |
          # Blocker 4.4: fail (not skip) when secrets are missing on trusted branches
          test -n "$E2E_API_KEY" || { echo "E2E_API_KEY secret is required"; exit 1; }
          test -n "$E2E_BASE_URL" || { echo "E2E_BASE_URL secret is required"; exit 1; }
          test -n "$E2E_MODEL" || { echo "E2E_MODEL secret is required"; exit 1; }
          python -m pytest sdk/tests/test_phase2_5_real_e2e.py -q --tb=short

  # ── NOTE: gateway-real-e2e (task 9.2) is deferred to Phase 3.1. ──
  # Round one ships the Gateway contract + runtime validated by the OFFLINE mock
  # harness E2E (Scenario A–J) in oneapi-adapter-tests — no real gateway key is
  # needed. A real One-API gateway E2E (One-API instance + a One-API token, NOT
  # a single-vendor model key) is added when the One-API adapter is wired into
  # the gateway server (Phase 3.1). See design.md D12 + spec §23/§30.
