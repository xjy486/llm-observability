name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk-tests:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: pip install -e sdk/python
      - run: |
          python -m pytest sdk/tests/ -q --tb=short

  core-tests:
    name: Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: |
          python -m pytest tests/ -q --tb=short

  proxy-tests:
    name: Proxy Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: |
          python -c "import sys; sys.path.insert(0,'proxy'); sys.path.insert(0,'core'); import trace_context, handler; print('proxy OK')"

  ui-typecheck:
    name: UI TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: ui
        run: |
          npm ci
          npx tsc --noEmit

  phase2-regression:
    name: Phase 2.1-2.5 Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: pip install -e sdk/python
      - run: |
          python -m pytest tests/test_phase2_2_final_fixes.py sdk/tests/test_phase2_3_regression.py sdk/tests/test_phase2_5_fixes.py -q --tb=short

  # ── Phase 3 Gateway Observability (task 9.1) ──
  gateway-runtime-tests:
    name: Gateway Runtime Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: pip install -e sdk/python
      - run: |
          python -m pytest sdk/tests/gateway_observability/ -q --tb=short \
            --ignore=sdk/tests/gateway_observability/test_real_gateway_e2e.py \
            --ignore=sdk/tests/gateway_observability/test_oneapi_adapter.py \
            --ignore=sdk/tests/gateway_observability/test_e2e_scenarios.py \
            --ignore=sdk/tests/gateway_observability/test_streaming.py

  oneapi-adapter-tests:
    name: One-API Adapter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: pip install -e sdk/python
      - run: |
          python -m pytest sdk/tests/gateway_observability/test_oneapi_adapter.py \
            sdk/tests/gateway_observability/test_e2e_scenarios.py \
            -q --tb=short

  gateway-streaming-tests:
    name: Gateway Streaming Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: pip install -e sdk/python
      - run: |
          python -m pytest sdk/tests/gateway_observability/test_streaming.py \
            sdk/tests/gateway_observability/test_stream_terminal_state.py -q --tb=short

  real-e2e:
    name: Real E2E (Live Endpoint)
    runs-on: ubuntu-latest
    # Only on trusted branches with secrets; fork PRs excluded
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: pip install -e sdk/python
      - env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_MODEL: ${{ secrets.E2E_MODEL }}
        run: |
          # Blocker 4.4: fail (not skip) when secrets are missing on trusted branches
          test -n "$E2E_API_KEY" || { echo "E2E_API_KEY secret is required"; exit 1; }
          test -n "$E2E_BASE_URL" || { echo "E2E_BASE_URL secret is required"; exit 1; }
          test -n "$E2E_MODEL" || { echo "E2E_MODEL secret is required"; exit 1; }
          python -m pytest sdk/tests/test_phase2_5_real_e2e.py -q --tb=short

  gateway-real-e2e:
    name: Gateway Real E2E
    runs-on: ubuntu-latest
    # Trusted branches only; the whole job is skipped on fork PRs (secrets
    # are unavailable there). On trusted branches missing secrets FAIL.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/base.txt
      - run: pip install -e sdk/python
      - env:
          # Unified gateway E2E env-var names (read by the test under these
          # exact names). Values are sourced from the existing E2E_* secrets —
          # both point at the same OpenAI-compatible endpoint, so no new
          # GATEWAY_E2E_* secrets need to be provisioned. Missing secrets still
          # FAIL the job on trusted branches via the test -n guards below.
          GATEWAY_E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          GATEWAY_E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          GATEWAY_E2E_MODEL: ${{ secrets.E2E_MODEL }}
        run: |
          # Rework P0-6: fail (not skip) when secrets are missing on trusted branches.
          test -n "$GATEWAY_E2E_API_KEY" || { echo "GATEWAY_E2E_API_KEY secret is required"; exit 1; }
          test -n "$GATEWAY_E2E_BASE_URL" || { echo "GATEWAY_E2E_BASE_URL secret is required"; exit 1; }
          test -n "$GATEWAY_E2E_MODEL" || { echo "GATEWAY_E2E_MODEL secret is required"; exit 1; }
          # Secrets are redacted via the Python filter (never a single-quoted
          # sed expression embedding the raw secret).
          set -o pipefail
          python -m pytest sdk/tests/gateway_observability/test_real_gateway_e2e.py \
            -q --tb=short -rs 2>&1 | tee /tmp/gateway_e2e.log | python scripts/redact_ci_secrets.py
          # Gate: the suite must actually RUN tests and SKIP none of them.
          python - <<'EOF'
          import re, sys
          log = open("/tmp/gateway_e2e.log", encoding="utf-8", errors="replace").read()
          summary = log.strip().splitlines()[-1] if log.strip() else ""
          passed = sum(int(n) for n in re.findall(r"(\d+) passed", summary))
          skipped = sum(int(n) for n in re.findall(r"(\d+) skipped", summary))
          failed = sum(int(n) for n in re.findall(r"(\d+) failed", summary))
          errors = sum(int(n) for n in re.findall(r"(\d+) error", summary))
          print(f"gateway-real-e2e gate: passed={passed} skipped={skipped} failed={failed} errors={errors}")
          if failed or errors:
              sys.exit("gateway real E2E had failures/errors")
          if passed <= 0:
              sys.exit("gateway real E2E ran ZERO tests — refusing a green no-op")
          if skipped != 0:
              sys.exit(f"gateway real E2E skipped {skipped} required tests — refusing silent skip")
          EOF
